<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eataly Staff Assistant</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%230F4C36'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Georgia,serif' font-size='20' font-weight='600' fill='%23F6F1E7'%3Ee%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#0F4C36; --green-dark:#0A3626; --red:#C8102E;
    --cream:#F6F1E7; --paper:#FFFDF8; --chip:#F1EADB; --chip-hover:#EFE7D6;
    --line:#E5DCC8; --line-strong:#D9CDB3;
    --ink:#1B1B1B; --ink-2:#3F3B34; --muted:#5E5A52;
    --side-muted:#CFE0D4; --side-label:#A9C7B4; --ok:#2E8B57;
    --serif:"Fraunces", Georgia, serif; --sans:"Inter", system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);color:var(--ink);font:400 15px/1.5 var(--sans)}
  button,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  svg{flex:none}
  :focus-visible{outline:2px solid var(--green);outline-offset:2px}
  .sidebar :focus-visible{outline-color:var(--cream)}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .app{display:flex;flex-wrap:wrap;min-height:100vh}

  /* Sidebar */
  .sidebar{flex:1 1 280px;min-width:0;max-width:100%;background:var(--green);color:var(--cream);
           padding:28px 20px;display:flex;flex-direction:column;gap:28px}
  .wordmark{font:600 30px/1 var(--serif);letter-spacing:.02em}
  .brand-sub{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:11px;letter-spacing:.12em;
             text-transform:uppercase;color:var(--side-label)}
  .tricolore{display:flex;width:36px;height:3px}
  .tricolore i{flex:1;background:#3FA36B}.tricolore i+i{background:#F6F1E7}.tricolore i+i+i{background:#E0473F}
  .btn-new{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;width:100%;
           border:1px solid rgba(246,241,231,.35);background:transparent;color:var(--cream);border-radius:12px;font-weight:500;font-size:14px}
  .btn-new:hover{background:rgba(246,241,231,.10)}
  .side-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--side-label);margin:0 0 8px 12px}
  .topic-list{display:flex;flex-direction:column;gap:2px}
  .topic{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border:0;border-radius:10px;
         background:transparent;color:var(--cream);font-size:14px;font-weight:500;text-align:left;white-space:nowrap}
  .topic:hover{background:rgba(246,241,231,.10)}
  .topic-dot{width:8px;height:8px;border-radius:50%}
  .recent-list{display:flex;flex-direction:column;gap:2px}
  .recent-item{display:block;width:100%;min-height:44px;padding:10px 12px;border:0;border-radius:10px;background:transparent;
               color:var(--side-muted);font-size:14px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .recent-item:hover{background:rgba(246,241,231,.06)}
  .recent-item[aria-current="true"]{background:rgba(246,241,231,.08);color:#E4ECE6}

  /* Main */
  .main{flex:999 1 560px;min-width:0;height:100vh;display:flex;flex-direction:column}
  .header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;
          padding:24px 40px;border-bottom:1px solid var(--line)}
  .header h1{margin:0;font:600 24px/1.2 var(--serif)}
  .subtitle{margin:4px 0 0;color:var(--muted);font-size:14px}
  .kb-pill{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:var(--paper);
           border:1px solid var(--line);font-size:13px;color:var(--ink-2)}
  .kb-dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
  .kb-pill.offline .kb-dot{background:var(--red)}
  .kb-pill.loading .kb-dot{background:var(--muted)}
  .scroller{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column-reverse}
  .column{flex:1 0 auto;width:100%;max-width:820px;margin:0 auto;padding:32px 40px;display:flex;flex-direction:column;gap:24px}

  /* Messages */
  .row-user{display:flex;justify-content:flex-end}
  .bubble-user{max-width:75%;background:var(--green);color:var(--cream);padding:12px 16px;border-radius:18px 18px 4px 18px;
               line-height:1.5;white-space:pre-line;overflow-wrap:anywhere}
  .row-bot{display:flex;gap:14px;align-items:flex-start}
  .avatar{width:36px;height:36px;border-radius:50%;background:var(--paper);border:1px solid var(--line);display:grid;
          place-items:center;font:600 18px/1 var(--serif);color:var(--green);flex:none}
  .bot-col{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
  .bubble-bot{align-self:flex-start;max-width:100%;background:var(--paper);border:1px solid var(--line);padding:16px 18px;
              border-radius:4px 18px 18px 18px;line-height:1.6;white-space:pre-line;overflow-wrap:anywhere}
  .bubble-bot.error{border-color:var(--red)}
  .meta-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
  .sources-label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:4px}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;background:var(--chip);
        color:var(--ink-2);font-size:13px;text-decoration:none;max-width:100%}
  .chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  a.chip:hover{background:var(--chip-hover);color:var(--green-dark)}
  .feedback{display:flex;margin-left:auto}
  .icon-btn{display:inline-grid;place-items:center;width:44px;height:36px;border:0;border-radius:10px;background:transparent;color:var(--muted)}
  .icon-btn:hover{background:var(--chip)}
  .icon-btn[aria-pressed="true"]{color:var(--green)}
  .btn-retry{align-self:flex-start;min-height:44px;padding:0 16px;border:1px solid var(--line-strong);border-radius:12px;
             background:var(--paper);font-size:14px;font-weight:500}
  .btn-retry:hover{border-color:var(--green)}
  .typing{display:inline-flex;align-items:center;gap:10px;padding:12px 16px;background:var(--paper);border:1px solid var(--line);
          border-radius:999px;font-size:13px;color:var(--muted)}
  .dots{display:inline-flex;gap:4px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:blink 1.2s infinite}
  .dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
  @media (prefers-reduced-motion: reduce){.dot{animation:none}}

  /* Empty state */
  .empty{margin:auto 0;text-align:center;padding:24px 0}
  .empty h2{margin:0;font:600 32px/1.2 var(--serif);color:var(--green)}
  .empty p{margin:8px 0 28px;color:var(--muted)}
  .cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;text-align:left}
  .card{min-height:72px;padding:16px;border-radius:14px;background:var(--paper);border:1px solid var(--line);font-size:14px;font-weight:500;text-align:left}
  .card:hover{border-color:var(--green)}

  /* Composer */
  .composer-wrap{width:100%;max-width:820px;margin:0 auto;padding:8px 40px 24px}
  .composer{display:flex;align-items:flex-end;gap:10px;padding:8px 8px 8px 20px;background:var(--paper);
            border:1px solid var(--line-strong);border-radius:16px;box-shadow:0 6px 24px rgba(60,45,20,.08)}
  .composer:focus-within{border-color:var(--green);box-shadow:0 0 0 3px rgba(15,76,54,.15)}
  .composer textarea{flex:1;min-height:44px;max-height:160px;padding:11px 0;border:0;outline:0;resize:none;background:transparent;
                     font-size:15px;line-height:22px}
  .composer textarea:focus-visible{outline:0}
  .btn-send{display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:12px;background:var(--red);color:#fff;flex:none}
  .btn-send:disabled{opacity:.5;cursor:default}
  .disclaimer{margin:10px 0 0;text-align:center;font-size:12px;color:var(--muted)}

  /* Phone */
  @media (max-width: 860px){
    .sidebar{flex-direction:row;flex-wrap:wrap;align-items:center;gap:16px;padding:16px}
    .brand{flex:1}
    .btn-new{width:auto;padding:0 14px}
    .topics{flex-basis:100%;min-width:0}
    .topics .side-label,.recent{display:none}
    .topic-list{flex-direction:row;overflow-x:auto;gap:8px;scrollbar-width:none}
    .topic{border:1px solid rgba(246,241,231,.25)}
    .main{height:100dvh}
    .header{padding:16px}
    .column{padding:16px}
    .composer-wrap{padding:8px 16px 16px}
    .cards{grid-template-columns:1fr}
    .bubble-user{max-width:85%}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="wordmark">eataly</div>
      <div class="brand-sub"><span class="tricolore" aria-hidden="true"><i></i><i></i><i></i></span>Staff Assistant</div>
    </div>
    <button class="btn-new" id="newChat" type="button"></button>
    <nav aria-label="Topics" class="topics">
      <p class="side-label">Ask about</p>
      <div class="topic-list" id="topics"></div>
    </nav>
    <section aria-label="Recent conversations" class="recent" id="recentSection" hidden>
      <p class="side-label">Recent</p>
      <div class="recent-list" id="recent"></div>
    </section>
  </aside>

  <main class="main">
    <header class="header">
      <div>
        <h1 id="greeting">Buongiorno</h1>
        <p class="subtitle">Ask anything about the menu, policies or kitchen procedures.</p>
      </div>
      <div class="kb-pill loading" id="kbPill" role="status"><span class="kb-dot" aria-hidden="true"></span><span id="kbText">Connecting to knowledge base…</span></div>
    </header>

    <div class="scroller">
      <div class="column" id="messages" role="log" aria-live="polite" aria-label="Conversation"></div>
    </div>

    <div class="composer-wrap">
      <form class="composer" id="composer">
        <label for="input" class="sr-only">Your question</label>
        <textarea id="input" rows="1" maxlength="2000" placeholder="Ask about a dish, a policy, a procedure…"></textarea>
        <button type="submit" class="btn-send" id="send" aria-label="Send" disabled></button>
      </form>
      <p class="disclaimer">Answers come from Eataly's internal documents. Always confirm allergen questions with the kitchen lead.</p>
    </div>
  </main>
</div>

<script>
  "use strict";
  const CONFIG = {
    API_BASE: "/api",
    CHAT_PATH: "/chat",
    FEEDBACK_PATH: "/feedback",
    HEALTH_PATH: "/health",
    STREAMING: true,
    USE_MOCK: new URLSearchParams(location.search).has("mock"),
    TIMEOUT_MS: 30000,     // until the first token arrives
    HISTORY_TURNS: 6
  };
  const KB_LABEL = "Menu · HR Handbook · Kitchen SOPs";
  const TOPICS = [
    { label: "Menu & allergens", color: "#E0473F", topic: "menu", q: "What allergens are in the Tagliatelle al Ragù?" },
    { label: "Wine & pairings",  color: "#E6B85C", topic: "wine", q: "Wine pairing for Cacio e Pepe?" },
    { label: "HR & policies",    color: "#9FD1B3", topic: "hr",   q: "How do I request time off?" },
    { label: "Kitchen SOPs",     color: "#F6F1E7", topic: "sops", q: "Closing checklist for the pasta station" }
  ];
  const SUGGESTIONS = [
    "What are the steps of service?",
    "How do I present a bottle of wine at the table?",
    "What does “al dente” mean?",
    "What are the bar closing duties?"
  ];
  const ERRORS = {
    generic: "Something went wrong. Try again.",
    auth: "Your session has expired. Please sign in again.",
    busy: "Too many questions at once. Try again in a moment.",
    loading: "The knowledge base is still loading. Try again in a minute."
  };
  const ICONS = {
    plus: '<path d="M12 5v14M5 12h14"/>',
    send: '<path d="M12 19V5M5 12l7-7 7 7"/>',
    stop: '<rect x="6" y="6" width="12" height="12" rx="2"/>',
    file: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',
    up: '<path d="M7 10v11H4V10zM7 10l4-7a3 3 0 0 1 3 3v4h5a2 2 0 0 1 2 2.3l-1.4 7A2 2 0 0 1 17.6 21H7"/>',
    down: '<path d="M17 14V3h3v11zM17 14l-4 7a3 3 0 0 1-3-3v-4H5a2 2 0 0 1-2-2.3l1.4-7A2 2 0 0 1 6.4 3H17"/>'
  };

  const state = {
    conversationId: null,
    messages: [],          // {id, role: "user"|"bot"|"error", text, sources: [], rating: null, topic}
    pending: false,
    controller: null,
    stopped: false,
    activeKey: null,
    conversations: []      // [{key, title, conversationId, messages}] for this tab; titles persist
  };
  const $ = (id) => document.getElementById(id);
  const els = { messages: $("messages"), input: $("input"), send: $("send"), form: $("composer"),
                topics: $("topics"), recent: $("recent"), recentSection: $("recentSection"), newChat: $("newChat") };

  // ---------- DOM helpers (model output only ever goes through textContent) ----------
  function el(tag, attrs = {}, ...children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") node.className = v;
      else if (k === "text") node.textContent = v;
      else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
      else node.setAttribute(k, v === true ? "" : v);
    }
    for (const c of children) if (c) node.append(c);
    return node;
  }
  function icon(name, size = 20) {
    // ICONS are fixed strings defined above, never user or model content.
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    for (const [k, v] of Object.entries({ viewBox: "0 0 24 24", width: size, height: size, fill: "none", stroke: "currentColor",
      "stroke-width": 2, "stroke-linecap": "round", "stroke-linejoin": "round", "aria-hidden": "true" })) svg.setAttribute(k, v);
    svg.innerHTML = ICONS[name];
    return svg;
  }
  // Light formatting: **bold** and "#" headings become <strong>; everything else stays plain text.
  function formatInto(node, text) {
    const frag = document.createDocumentFragment();
    text.split("\n").forEach((line, i) => {
      if (i) frag.append("\n");
      const heading = line.match(/^\s*#{1,6}\s+(.*)$/);
      if (heading) { frag.append(el("strong", { text: heading[1] })); return; }
      line.split(/(\*\*[^*]+\*\*)/g).forEach((part) => {
        if (/^\*\*[^*]+\*\*$/.test(part)) frag.append(el("strong", { text: part.slice(2, -2) }));
        else if (part) frag.append(part);
      });
    });
    node.replaceChildren(frag);
  }
  function safeHref(url) {
    if (!url) return null;
    try {
      const u = new URL(url, location.href);
      return u.origin === location.origin || u.protocol === "https:" ? u.href : null;
    } catch { return null; }
  }

  // ---------- Backend adapter ----------
  function normalize(raw) {
    return {
      answer: raw.answer ?? raw.response ?? raw.output ?? "",
      sources: (raw.sources ?? raw.documents ?? raw.citations ?? []).map(s => ({
        title: s.title ?? s.name ?? s.metadata?.source ?? "Document",
        page: s.page ?? null,
        url: s.url ?? s.metadata?.url ?? null,
        snippet: s.snippet ?? s.page_content?.slice(0, 200) ?? ""
      })),
      conversationId: raw.conversation_id ?? raw.session_id ?? null,
      messageId: raw.message_id ?? raw.id ?? null
    };
  }
  class HttpError extends Error { constructor(status, message) { super(message); this.status = status; } }

  async function askBackend(payload, { onToken, onSources, signal }) {
    if (CONFIG.USE_MOCK) return mockBackend(payload, { onToken, onSources, signal });
    const res = await fetch(CONFIG.API_BASE + CONFIG.CHAT_PATH, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload), signal, credentials: "same-origin"
    });
    if (!res.ok) {
      let detail = null;
      try { detail = (await res.json()).detail; } catch {}
      throw new HttpError(res.status, typeof detail === "string" ? detail : null);
    }
    if (!CONFIG.STREAMING) {
      const result = normalize(await res.json());
      onToken(result.answer); onSources(result.sources);
      return result;
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "", answer = "", sources = [], ids = {};
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let cut;
      while ((cut = buffer.indexOf("\n\n")) !== -1) {
        const block = buffer.slice(0, cut); buffer = buffer.slice(cut + 2);
        let event = "message", data = "";
        for (const line of block.split("\n")) {
          if (line.startsWith("event:")) event = line.slice(6).trim();
          else if (line.startsWith("data:")) data += line.slice(5).trim();
        }
        const parsed = data ? JSON.parse(data) : {};
        if (event === "token") { answer += parsed.text ?? ""; onToken(parsed.text ?? ""); }
        else if (event === "sources") { sources = normalize({ sources: parsed.sources }).sources; onSources(sources); }
        else if (event === "done") ids = parsed;
        else if (event === "error") throw new HttpError(500, null);
      }
    }
    if (!ids.message_id) throw new HttpError(500, null);   // stream ended early
    return normalize({ answer, sources, ...ids });
  }

  async function mockBackend(payload, { onToken, onSources, signal }) {
    const table = [
      [/allergen|ragù|ragu/i, "Tagliatelle al Ragù contains **gluten, egg, dairy and celery**.\nAlways confirm with the kitchen lead before advising a guest.", "Allergen Matrix", "3"],
      [/time off|vacation|leave/i, "Request time off in Dayforce at least two weeks ahead.\n1. Open Dayforce\n2. Choose Time Away\n3. Submit for manager approval", "Dayforce 101", "5"],
      [/wine|pairing|cacio/i, "Cacio e Pepe pairs well with a crisp white such as **Pecorino Villa Angela**.", "Pecorino Villa Angela Velenosi", "1"],
      [/closing|checklist/i, "Closing checklist:\n1. Clean and sanitise surfaces\n2. Label and store mise en place\n3. Sign the closing log", "EEC Bar Closing Duties", "2"],
      [/uniform|shoes|dress/i, "FOH staff wear the black apron, black shirt and non-slip shoes.", "FOH Uniforms", "1"]
    ];
    const hit = table.find(([re]) => re.test(payload.message));
    const answer = hit ? hit[1] : "Unfortunately this is beyond the scope of my knowledge. For the most updated answer, please ask a manager.";
    const wait = (ms) => new Promise((resolve, reject) => {
      const t = setTimeout(resolve, ms);
      signal.addEventListener("abort", () => { clearTimeout(t); reject(new DOMException("Aborted", "AbortError")); }, { once: true });
    });
    await wait(900);
    for (const word of answer.split(/(?<=\s)/)) { onToken(word); await wait(25); }
    const sources = hit ? [{ title: hit[2], page: hit[3], url: null, snippet: answer.slice(0, 120) }] : [];
    onSources(sources);
    return { answer, sources, conversationId: payload.conversation_id || "c_mock", messageId: "m_" + Math.random().toString(36).slice(2, 10) };
  }

  function sendFeedback(messageId, rating) {
    if (CONFIG.USE_MOCK || !messageId) return;
    fetch(CONFIG.API_BASE + CONFIG.FEEDBACK_PATH, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message_id: messageId, rating }), credentials: "same-origin", keepalive: true
    }).catch(() => {});
  }

  async function checkHealth() {
    const pill = $("kbPill"), text = $("kbText");
    let status = "offline";
    if (CONFIG.USE_MOCK) status = "ready";
    else {
      try {
        const res = await fetch(CONFIG.API_BASE + CONFIG.HEALTH_PATH, { cache: "no-store" });
        const body = await res.json().catch(() => ({}));
        status = res.ok ? "ready" : body.status === "loading" ? "loading" : "offline";
      } catch {}
    }
    pill.classList.toggle("offline", status === "offline");
    pill.classList.toggle("loading", status === "loading");
    text.textContent = status === "ready" ? KB_LABEL : status === "loading" ? "Knowledge base loading…" : "Knowledge base offline";
    setTimeout(checkHealth, status === "ready" ? 60000 : 10000);
  }

  // ---------- Rendering ----------
  function renderEmptyState() {
    els.messages.replaceChildren(el("div", { class: "empty" },
      el("h2", { text: "Come posso aiutarti?" }),
      el("p", { text: "Pick a question to start, or type your own below." }),
      el("div", { class: "cards" }, ...SUGGESTIONS.map(q => el("button", { class: "card", type: "button", text: q, onclick: () => send(q) })))
    ));
  }
  function clearEmptyState() { els.messages.querySelector(".empty")?.remove(); }

  function renderUserMessage(msg) {
    clearEmptyState();
    els.messages.append(el("div", { class: "row-user" }, el("div", { class: "bubble-user", text: msg.text })));
  }

  function renderBotMessage(msg) {
    clearEmptyState();
    const bubble = el("div", { class: "bubble-bot" });
    formatInto(bubble, msg.text);
    const meta = el("div", { class: "meta-row", hidden: true });
    const row = el("div", { class: "row-bot" }, el("div", { class: "avatar", "aria-hidden": "true", text: "e" }),
      el("div", { class: "bot-col" }, bubble, meta));
    els.messages.append(row);
    msg.dom = { bubble, meta };
    return msg.dom;
  }
  function updateBotText(msg) { formatInto(msg.dom.bubble, msg.text); }

  function renderMeta(msg) {
    const { meta } = msg.dom;
    meta.replaceChildren();
    if (msg.sources.length) {
      meta.append(el("span", { class: "sources-label", text: "Sources" }));
      for (const s of msg.sources) {
        const label = s.page ? `${s.title} · p. ${s.page}` : s.title;
        const href = safeHref(s.url);
        const chip = href
          ? el("a", { class: "chip", href, target: "_blank", rel: "noopener noreferrer", title: s.snippet || label })
          : el("span", { class: "chip", title: s.snippet || label });
        chip.append(icon("file", 13), el("span", { text: label }));
        meta.append(chip);
      }
    }
    if (msg.id) {
      const feedback = el("span", { class: "feedback" });
      for (const [rating, name, label] of [["up", "up", "Helpful"], ["down", "down", "Not helpful"]]) {
        const btn = el("button", { class: "icon-btn", type: "button", "aria-label": label, "aria-pressed": String(msg.rating === rating) }, icon(name, 18));
        btn.addEventListener("click", () => {
          msg.rating = msg.rating === rating ? null : rating;
          feedback.querySelectorAll(".icon-btn").forEach(b => b.setAttribute("aria-pressed", String(b === btn && msg.rating === rating)));
          sendFeedback(msg.id, msg.rating);
        });
        feedback.append(btn);
      }
      meta.append(feedback);
    }
    meta.hidden = !meta.childElementCount;
  }

  let typingRow = null;
  function renderTyping(show) {
    typingRow?.remove(); typingRow = null;
    if (!show) return;
    clearEmptyState();
    typingRow = el("div", { class: "row-bot" }, el("div", { class: "avatar", "aria-hidden": "true", text: "e" }),
      el("div", { class: "typing" },
        el("span", { class: "dots", "aria-hidden": "true" }, el("span", { class: "dot" }), el("span", { class: "dot" }), el("span", { class: "dot" })),
        el("span", { "aria-hidden": "true", text: "Searching the knowledge base…" }),
        el("span", { class: "sr-only", text: "Assistant is typing" })));
    els.messages.append(typingRow);
  }

  function renderError(message, retryText, retryTopic) {
    const row = el("div", { class: "row-bot" }, el("div", { class: "avatar", "aria-hidden": "true", text: "e" }),
      el("div", { class: "bot-col" },
        el("div", { class: "bubble-bot error", text: message }),
        el("button", { class: "btn-retry", type: "button", text: "Retry",
          onclick: () => { row.remove(); state.messages = state.messages.filter(m => m.role !== "error"); send(retryText, retryTopic, { retry: true }); } })));
    els.messages.append(row);
  }

  function updateComposer() {
    els.send.replaceChildren(icon(state.pending ? "stop" : "send"));
    els.send.setAttribute("aria-label", state.pending ? "Stop" : "Send");
    els.send.disabled = !state.pending && !els.input.value.trim();
    els.input.disabled = state.pending;
  }
  function autoGrow() {
    els.input.style.height = "auto";
    els.input.style.height = Math.min(els.input.scrollHeight, 160) + "px";
  }

  // ---------- Conversations ----------
  const RECENT_KEY = "eataly.recentTitles";
  function loadTitles() { try { return JSON.parse(localStorage.getItem(RECENT_KEY)) || []; } catch { return []; } }
  function saveTitles() {
    try { localStorage.setItem(RECENT_KEY, JSON.stringify(state.conversations.slice(0, 8).map(c => ({ key: c.key, title: c.title })))); } catch {}
  }
  function currentConversation() { return state.conversations.find(c => c.key === state.activeKey); }

  function renderRecent() {
    els.recent.replaceChildren(...state.conversations.slice(0, 8).map(c =>
      el("button", { class: "recent-item", type: "button", text: c.title, title: c.title,
        "aria-current": c.key === state.activeKey ? "true" : null, onclick: () => openConversation(c) })));
    els.recentSection.hidden = !state.conversations.length;
  }

  function openConversation(c) {
    if (!c.messages) {   // only the title survived a reload: ask it again inside the same entry
      newConversation();
      c.messages = state.messages; state.activeKey = c.key; renderRecent();
      send(c.title);
      return;
    }
    abortRequest();
    state.activeKey = c.key; state.conversationId = c.conversationId; state.messages = c.messages;
    els.messages.replaceChildren();
    for (const m of state.messages) {
      if (m.role === "user") renderUserMessage(m);
      else if (m.role === "bot") { renderBotMessage(m); renderMeta(m); }
    }
    if (!state.messages.length) renderEmptyState();
    renderRecent(); updateComposer(); els.input.focus();
  }

  function newConversation() {
    abortRequest();
    state.activeKey = null; state.conversationId = null; state.messages = [];
    renderTyping(false); renderEmptyState(); renderRecent(); updateComposer();
    els.input.focus();
  }

  function abortRequest() {
    if (state.controller) { state.stopped = true; state.controller.abort(); }
  }

  // ---------- Send flow ----------
  async function send(text, topic = null, { retry = false } = {}) {
    text = (text || "").trim();
    if (!text || state.pending) return;
    if (!state.activeKey) {
      const conv = { key: "k" + Date.now(), title: text.slice(0, 40), conversationId: null, messages: state.messages };
      state.conversations.unshift(conv); state.activeKey = conv.key; saveTitles(); renderRecent();
    }
    const history = state.messages.filter(m => m.role === "user" || m.role === "bot").slice(-CONFIG.HISTORY_TURNS)
      .map(m => ({ role: m.role === "user" ? "user" : "assistant", content: m.text }));
    if (retry) history.pop();   // the retried question is already the last user turn
    if (!retry) {
      const userMsg = { role: "user", text, topic };
      state.messages.push(userMsg); renderUserMessage(userMsg);
    }
    els.input.value = ""; autoGrow();
    const controller = new AbortController();
    Object.assign(state, { pending: true, controller, stopped: false });
    updateComposer(); renderTyping(true);
    els.messages.setAttribute("aria-busy", "true");

    let timedOut = false;
    const timer = setTimeout(() => { timedOut = true; controller.abort(); }, CONFIG.TIMEOUT_MS);
    let botMsg = null;
    const ensureBot = () => {
      if (botMsg) return botMsg;
      clearTimeout(timer); renderTyping(false);
      botMsg = { role: "bot", text: "", sources: [], rating: null, id: null };
      state.messages.push(botMsg); renderBotMessage(botMsg);
      return botMsg;
    };
    try {
      const result = await askBackend(
        { message: text, conversation_id: state.conversationId, history, topic },
        { onToken: (t) => { const m = ensureBot(); m.text += t; updateBotText(m); },
          onSources: (s) => { ensureBot().sources = s; },
          signal: controller.signal });
      const m = ensureBot();
      m.id = result.messageId; m.text = result.answer || m.text; m.sources = result.sources;
      updateBotText(m); renderMeta(m);
      state.conversationId = result.conversationId ?? state.conversationId;
      const conv = currentConversation(); if (conv) conv.conversationId = state.conversationId;
    } catch (err) {
      renderTyping(false);
      if (state.stopped && !timedOut) {
        if (botMsg) renderMeta(botMsg);         // keep partial text after Stop
      } else {
        if (botMsg) { state.messages.splice(state.messages.indexOf(botMsg), 1); botMsg.dom.bubble.closest(".row-bot").remove(); }
        const status = err instanceof HttpError ? err.status : 0;
        const message = status === 401 || status === 403 ? ERRORS.auth
          : status === 429 ? ERRORS.busy
          : status === 503 ? (err.message || ERRORS.loading)
          : ERRORS.generic;
        state.messages.push({ role: "error", text: message });
        renderError(message, text, topic);
      }
    } finally {
      clearTimeout(timer);
      if (state.controller === controller) Object.assign(state, { pending: false, controller: null });
      els.messages.setAttribute("aria-busy", "false");
      updateComposer();
      if (!state.pending) els.input.focus();
    }
  }

  // ---------- Wiring ----------
  els.newChat.append(icon("plus", 16), "New conversation");
  els.newChat.addEventListener("click", newConversation);
  for (const t of TOPICS) {
    const btn = el("button", { class: "topic", type: "button", onclick: () => send(t.q, t.topic) },
      el("span", { class: "topic-dot", style: `background:${t.color}`, "aria-hidden": "true" }), el("span", { text: t.label }));
    els.topics.append(btn);
  }
  els.form.addEventListener("submit", (e) => {
    e.preventDefault();
    if (state.pending) abortRequest(); else send(els.input.value);
  });
  els.input.addEventListener("input", () => { autoGrow(); updateComposer(); });
  els.input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); if (!state.pending) send(els.input.value); }
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && state.pending) abortRequest(); });

  $("greeting").textContent = new Date().getHours() < 17 ? "Buongiorno" : "Buonasera";
  state.conversations = loadTitles().map(c => ({ ...c, conversationId: null, messages: null }));
  renderRecent();
  updateComposer();
  renderEmptyState();
  checkHealth();
</script>
</body>
</html>
