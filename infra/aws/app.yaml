AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Eataly AI runtime - one Fargate task behind an ALB in the default VPC. Holds everything billable so it can
  be deleted to stop costs; durable data and roles come from the foundation stack.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    arch: internet -> ALB:80 (AllowedCidr only) -> Fargate task :8501 (public IP, no NAT) -> OpenAI/S3/ECR over 443
    must:
      - cluster, service, task family and container all named eataly-ai; deploy workflow + deploy role depend on it
      - GitHub Actions registers new task-definition revisions outside CFN; pass the currently deployed ImageTag on stack updates or the image rolls back
    ref:
      - at: docs/aws-setup.md
        has: deploy + teardown runbook

Parameters:
  FoundationStackName:
    Type: String
    Default: eataly-ai-foundation
    AllowedPattern: "^[A-Za-z][A-Za-z0-9-]*$"
    Description: Stack that exports bucket, secret, ECR repo, log group and roles
  # Plain String/CommaDelimitedList instead of AWS::EC2::VpcId / List<AWS::EC2::Subnet::Id>: CloudFormation's
  # lookup for those types failed in this account ("does not exist") although the default VPC exists.
  VpcId:
    Type: String
    AllowedPattern: "^vpc-[0-9a-f]+$"
    Description: VPC for the load balancer and task (default VPC is fine)
  SubnetIds:
    Type: CommaDelimitedList
    Description: At least two public subnets in different AZs (subnet-...,subnet-...)
  AllowedCidr:
    Type: String
    AllowedPattern: "^([0-9]{1,3}\\.){3}[0-9]{1,3}/([0-9]|[1-2][0-9]|3[0-2])$"
    Description: Who may open the app (e.g. your IP as x.x.x.x/32). There is no login, so keep this narrow.
  ImageTag:
    Type: String
    AllowedPattern: "^[A-Za-z0-9_.-]{1,128}$"
    Description: Tag of the image in the eataly-ai ECR repo to run
  DesiredCount:
    Type: Number
    Default: 1
    AllowedValues: [0, 1]
    Description: 1 to run, 0 to pause the task (the load balancer still bills)
  AlertEmail:
    Type: String
    Default: ""
    Description: Optional email for health alarms (you must confirm the subscription email)

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]

Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: eataly-ai
      Tags:
        - Key: app
          Value: eataly-ai

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Metadata:
      com.aws.cloudformation.Context:
        why: 1 vCPU / 2 GB fits in-memory Chroma over the current PDF set; x86 because CI builds on x86 runners
        must:
          - secret keys OPENAI_API_KEY + LANGSMITH_API_KEY must exist in the foundation secret JSON
    Properties:
      Family: eataly-ai
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "1024"
      Memory: "2048"
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !ImportValue
        Fn::Sub: ${FoundationStackName}-TaskExecutionRoleArn
      TaskRoleArn: !ImportValue
        Fn::Sub: ${FoundationStackName}-TaskRoleArn
      ContainerDefinitions:
        - Name: eataly-ai
          Image: !Sub
            - ${RepoUri}:${ImageTag}
            - RepoUri: !ImportValue
                Fn::Sub: ${FoundationStackName}-RepositoryUri
          Essential: true
          PortMappings:
            - ContainerPort: 8501
              Protocol: tcp
          Environment:
            - Name: KNOWLEDGE_BASE_S3_URI
              Value: !Sub
                - s3://${Bucket}/documents/
                - Bucket: !ImportValue
                    Fn::Sub: ${FoundationStackName}-DataBucketName
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: LANGSMITH_TRACING
              Value: "true"
            - Name: LANGSMITH_PROJECT
              Value: eataly-ai
          Secrets:
            - Name: OPENAI_API_KEY
              ValueFrom: !Sub
                - "${SecretArn}:OPENAI_API_KEY::"
                - SecretArn: !ImportValue
                    Fn::Sub: ${FoundationStackName}-AppSecretArn
            - Name: LANGSMITH_API_KEY
              ValueFrom: !Sub
                - "${SecretArn}:LANGSMITH_API_KEY::"
                - SecretArn: !ImportValue
                    Fn::Sub: ${FoundationStackName}-AppSecretArn
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !ImportValue
                Fn::Sub: ${FoundationStackName}-LogGroupName
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app
      Tags:
        - Key: app
          Value: eataly-ai

  # ---------- Network ----------
  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: HTTP only because there is no domain/certificate yet; ingress limited to AllowedCidr since the app has no login
        must:
          - do not open to 0.0.0.0/0 until HTTPS + Cognito auth are in place
    Properties:
      GroupDescription: Eataly AI load balancer - HTTP from allowed CIDR
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref AllowedCidr
          Description: HTTP from allowed client range
      Tags:
        - Key: app
          Value: eataly-ai

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Eataly AI task - 8501 from the load balancer only, HTTPS out
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS to OpenAI, LangSmith, S3, ECR, Secrets Manager, CloudWatch
      Tags:
        - Key: app
          Value: eataly-ai

  TaskIngressFromLoadBalancer:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref TaskSecurityGroup
      IpProtocol: tcp
      FromPort: 8501
      ToPort: 8501
      SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
      Description: Streamlit from the load balancer

  LoadBalancerEgressToTask:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref LoadBalancerSecurityGroup
      IpProtocol: tcp
      FromPort: 8501
      ToPort: 8501
      DestinationSecurityGroupId: !Ref TaskSecurityGroup
      Description: Forward to Streamlit tasks

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets: !Ref SubnetIds
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: "300"
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"
      Tags:
        - Key: app
          Value: eataly-ai

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: Streamlit health endpoint; sticky sessions keep a browser's websocket on one task if scaled past 1
    Properties:
      VpcId: !Ref VpcId
      TargetType: ip
      Protocol: HTTP
      Port: 8501
      HealthCheckPath: /_stcore/health
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"
        - Key: stickiness.enabled
          Value: "true"
        - Key: stickiness.type
          Value: lb_cookie
      Tags:
        - Key: app
          Value: eataly-ai

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  Service:
    Type: AWS::ECS::Service
    DependsOn: HttpListener
    Metadata:
      com.aws.cloudformation.Context:
        why: public IP instead of NAT gateway (~$35/mo saved); circuit breaker rolls back deploys that never get healthy
        must:
          - name eataly-ai (deploy workflow + deploy role ARN)
    Properties:
      ServiceName: eataly-ai
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      HealthCheckGracePeriodSeconds: 120
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref SubnetIds
          SecurityGroups: [!Ref TaskSecurityGroup]
      LoadBalancers:
        - ContainerName: eataly-ai
          ContainerPort: 8501
          TargetGroupArn: !Ref TargetGroup
      PropagateTags: SERVICE
      Tags:
        - Key: app
          Value: eataly-ai

  # ---------- Alarm ----------
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      KmsMasterKeyId: alias/aws/sns
      Subscription: !If
        - HasAlertEmail
        - - Endpoint: !Ref AlertEmail
            Protocol: email
        - !Ref AWS::NoValue
      Tags:
        - Key: app
          Value: eataly-ai

  UnhealthyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Eataly AI has no healthy task behind the load balancer
      Namespace: AWS/ApplicationELB
      MetricName: HealthyHostCount
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt LoadBalancer.LoadBalancerFullName
        - Name: TargetGroup
          Value: !GetAtt TargetGroup.TargetGroupFullName
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 5
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

Outputs:
  AppUrl:
    Description: Open this in a browser (only from AllowedCidr)
    Value: !Sub http://${LoadBalancer.DNSName}
  ClusterName:
    Description: ECS cluster
    Value: !Ref Cluster
  ServiceName:
    Description: ECS service
    Value: !GetAtt Service.Name
